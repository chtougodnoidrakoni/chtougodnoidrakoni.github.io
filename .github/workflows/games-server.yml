name: Сервер записей (Telegram)

# Выкладывает сервер записей в Cloudflare и подключает бота.
# Нужны секреты репозитория: BOT_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/games-server.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: games-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      APP_URL: https://chtougodnoidrakoni.github.io/app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ключи на месте?
        id: keys
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Не хватает секретов BOT_TOKEN / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — сервер не выкладываю."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: База D1
        if: steps.keys.outputs.ok == '1'
        working-directory: worker
        run: |
          ID=$(npx -y wrangler@3 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='chd-games');process.stdout.write(d?d.uuid:'')")
          if [ -z "$ID" ]; then
            npx -y wrangler@3 d1 create chd-games
            ID=$(npx -y wrangler@3 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(l.find(x=>x.name==='chd-games').uuid)")
          fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx -y wrangler@3 d1 execute chd-games --remote --file=schema.sql -y

      - name: Выкладка сервера
        if: steps.keys.outputs.ok == '1'
        id: deploy
        working-directory: worker
        run: |
          npx -y wrangler@3 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Не нашёл адрес сервера. Откройте в Cloudflare раздел Workers & Pages один раз, чтобы получить адрес workers.dev"; exit 1; fi
          SECRET=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          printf '%s' "$BOT_TOKEN" | npx -y wrangler@3 secret put BOT_TOKEN
          printf '%s' "$SECRET" | npx -y wrangler@3 secret put BOT_SECRET
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
          curl -fsS "$URL/" && echo

      - name: Подключение бота
        if: steps.keys.outputs.ok == '1'
        run: |
          API="https://api.telegram.org/bot$BOT_TOKEN"
          curl -fsS "$API/setWebhook" -d "url=${{ steps.deploy.outputs.url }}/bot/${{ steps.deploy.outputs.secret }}" -d "drop_pending_updates=true"; echo
          curl -fsS "$API/setChatMenuButton" -H 'content-type: application/json' -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Игры\",\"web_app\":{\"url\":\"$APP_URL\"}}}"; echo
          curl -fsS "$API/setMyCommands" -H 'content-type: application/json' -d '{"commands":[{"command":"start","description":"Ближайшие игры клуба"}]}'; echo
          curl -fsS "$API/setMyDescription" -H 'content-type: application/json' -d '{"description":"Бот клуба «Что угодно и драконы»: ближайшие игры, запись в одно нажатие и напоминания."}'; echo

      - name: Адрес сервера — в приложение
        if: steps.keys.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{ "api": "%s" }\n' "${{ steps.deploy.outputs.url }}" > public/app-config.json
          if ! git diff --quiet public/app-config.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/app-config.json
            git commit -m "Приложение: адрес сервера записей"
            git push
            gh workflow run "Проверка и публикация" --ref main
          fi
