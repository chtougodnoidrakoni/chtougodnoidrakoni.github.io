name: Напоминание админам сейчас

# Разовая отправка напоминания Кате и Насте (как в среду). Запускается вручную.
on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ea02390c0a20b131134814fbd0121c16' }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить
        working-directory: worker
        run: |
          ID=$(npx -y wrangler@3 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write((l.find(x=>x.name==='chd-games')||{}).uuid||'')")
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx -y wrangler@3 d1 execute chd-games --remote --json --command "SELECT id, name, username FROM users WHERE started = 1 AND username IN ('oh_katiakaterina','aalkhutova')" > users.json
          node -e '
            const rows = JSON.parse(require("fs").readFileSync("users.json","utf8"))[0].results;
            const want = ["oh_katiakaterina","aalkhutova"];
            for (const u of want) if (!rows.find(r => r.username === u)) console.log("::warning::@" + u + " ещё не нажимал(а) Старт — напоминание не дойдёт");
            (async () => {
              for (const r of rows) {
                const first = (r.name.split(/\s+/)[0] || r.name).replace(/[<>&]/g, "");
                const text = "🗓 " + first + ", привет! Не забудь подготовить расписание на следующую неделю.\n\nНажми «📅 Составить расписание» внизу чата — я спрошу про каждую игру и соберу пост для канала.";
                const res = await fetch("https://api.telegram.org/bot" + process.env.BOT_TOKEN + "/sendMessage", { method: "POST", headers: { "content-type": "application/json" },
                  body: JSON.stringify({ chat_id: r.id, text, reply_markup: { keyboard: [[{ text: "📅 Составить расписание" }]], resize_keyboard: true, is_persistent: true } }) });
                const j = await res.json(); console.log("@" + r.username + ": " + (j.ok ? "отправлено" : j.description));
              }
            })();
          '
